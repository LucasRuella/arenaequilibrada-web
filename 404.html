<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ArenaEquilibrada</title>
  <!--
    Este 404.html existe apenas como fallback do GitHub Pages para
    deep links. Ele redireciona imediatamente para o index.html
    (via "?v={uuid}"), que é sempre a versão mais recente.

    Por que redirecionar em vez de espelhar o index.html?
    O GitHub Pages CDN cacheia o 404.html de forma agressiva,
    tornando atualizacoes da PWA invisiveis para o usuario.
    O index.html (servido para "/" e "/?v=...") e invalidado
    com mais frequencia e respeita melhor as meta tags no-cache.
  -->
  <script>
    (function () {
      var m = window.location.pathname.match(/\/v\/([0-9a-fA-F-]+)/);
      var target = window.location.origin + '/arenaequilibrada-web/';
      if (m) target += '?v=' + m[1];
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <p>Redirecionando…</p>
</body>
</html>
