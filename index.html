<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#0F9D58">
  <!--
    <base> com caminho absoluto do GitHub Pages: garante que os paths
    relativos (./app.js, ./styles.css, ./manifest.webmanifest) resolvam
    corretamente mesmo quando o usuário acessa /v/{uuid} (deep link).
  -->
  <base href="/arenaequilibrada-web/">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>ArenaEquilibrada</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%230F9D58'/%3E%3Ctext x='50' y='68' text-anchor='middle' font-size='60' fill='white'%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">
  <link rel="manifest" href="./manifest.webmanifest?v=2">
  <link rel="stylesheet" href="./styles.css?v=2">
</head>
<body>
  <header class="topbar">
    <div class="logo">⚽ ArenaEquilibrada</div>
    <div class="subtitle" id="subtitle">Carregando…</div>
    <!-- Filtros de período (preenchidos dinamicamente pelo app.js).
         Escondidos até as peladas serem carregadas. -->
    <div id="filters" class="filters" hidden>
      <label class="filter-label" for="filter-year">Ano</label>
      <select id="filter-year" class="filter-select" aria-label="Filtrar por ano"></select>
      <label class="filter-label" for="filter-month">Mês</label>
      <select id="filter-month" class="filter-select" aria-label="Filtrar por mês"></select>
    </div>
  </header>

  <main>
    <section id="error-box" class="card error" hidden>
      <h2>Não foi possível carregar</h2>
      <p id="error-message"></p>
      <p class="hint">Verifique se o link está correto e tente novamente em alguns instantes.</p>
    </section>

    <section id="loading" class="card center">
      <div class="spinner"></div>
      <p>Buscando peladas…</p>
    </section>

    <section id="empty" class="card center" hidden>
      <h2>📭 Nenhuma pelada finalizada ainda</h2>
      <p>Quando o organizador finalizar uma pelada, ela aparecerá aqui.</p>
    </section>

    <section id="content" hidden>
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="rankings" role="tab">🏆 Ranking</button>
        <button class="tab" data-tab="scorers" role="tab">⚽ Artilheiros</button>
        <button class="tab" data-tab="assists" role="tab"><svg class="icon-shoe icon-shoe-tab" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2 16h20v3H2zM3 16V11c0-1.5 1-2.5 2.5-2.5h7C14 8.5 15 9.5 15 11l.5.5c1 1 1.5 2 1.5 3v1H3z"/><g fill="none" stroke="white" stroke-width="0.7" stroke-linecap="round"><line x1="6" y1="11" x2="13" y2="11"/><line x1="6" y1="13" x2="13" y2="13"/><line x1="6" y1="15" x2="13" y2="15"/></g><g fill="currentColor"><circle cx="5" cy="20" r="1"/><circle cx="9" cy="20" r="1"/><circle cx="13" cy="20" r="1"/><circle cx="17" cy="20" r="1"/></g></svg> Assistências</button>
        <button class="tab" data-tab="history" role="tab">📋 Histórico</button>
      </div>

      <div class="tab-panel active" data-panel="rankings">
        <div id="rankings-list"></div>
      </div>

      <div class="tab-panel" data-panel="scorers">
        <div id="scorers-list"></div>
      </div>

      <div class="tab-panel" data-panel="assists">
        <div id="assists-list"></div>
      </div>

      <div class="tab-panel" data-panel="history">
        <div id="history-list"></div>
      </div>
    </section>
  </main>

  <footer>
    <small>Gerado a partir do app ArenaEquilibrada • <span id="generated-at"></span></small>
  </footer>

  <script>
    // Redireciona URLs legadas "/v/{uuid}" para "?v={uuid}".
    // Por que: o GitHub Pages servia o 404.html para "/v/{uuid}", que
    // era cacheado agressivamente. Direto no index.html (via ?v=) o
    // navegador sempre pega a versão mais recente.
    (function () {
      var m = window.location.pathname.match(/^\/v\/([0-9a-fA-F-]+)\/?$/);
      if (m) {
        var id = m[1];
        var target = window.location.origin + window.location.pathname.replace(/^\/v\/[0-9a-fA-F-]+\/?$/, '/') + '?v=' + id;
        window.location.replace(target);
      }
    })();
  </script>
  <script src="./app.js?v=2"></script>
</body>
</html>
